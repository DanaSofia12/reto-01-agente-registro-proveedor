name: CI

on: [push, pull_request]

jobs:
  calidad:
    runs-on: ubuntu-latest
    env:
      FECHA_REFERENCIA: "2026-09-03"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - run: bun install --frozen-lockfile

      - name: Tipos estrictos, sin any
        run: bun run typecheck

      - name: Lint y formato
        run: bun run lint

      - name: Tests de dominio, herramientas y ciclo
        run: bun test

      - name: demo.ts corre SIN clave de ningún proveedor
        run: bun run demo.ts

      - name: El módulo reutilizable no divergió de las fuentes
        run: bun run modulo:check

      - name: Rúbrica verificable
        run: bun run verificar

      - name: Ninguna clave filtrada
        run: |
          if grep -rInE '(sk-ant-[a-zA-Z0-9]|sk-proj-[a-zA-Z0-9]|AIzaSy[a-zA-Z0-9])' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=out .; then
            echo "::error::Patrón de clave de API encontrado"
            exit 1
          fi
          test ! -f .env || { echo "::error::.env no debe versionarse"; exit 1; }

      - name: El front compila
        run: bun run build
